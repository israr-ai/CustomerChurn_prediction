<!DOCTYPE html>
<html lang="en">
<head>
  <title>Prediction Result</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex justify-center items-center min-h-screen">

  <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-[450px] text-center">
    <h1 class="text-2xl font-bold mb-4">Prediction Result</h1>

    <p class="text-xl mb-3">{{ prediction }}</p>

    <p class="text-lg text-gray-300">Churn Probability: <b>{{ probability }}%</b></p>

    <a href="/" class="block mt-6 bg-blue-600 hover:bg-blue-700 p-2 rounded font-bold">
      Go Back
    </a>
  </div>

</body>
</html>
